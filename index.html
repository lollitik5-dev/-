
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Магазин товарів</h1>

    <div class="container">

        <div class="products">
            <h2>Картки товарів</h2>

            <div class="product-card" data-name="Навушники" data-price="800">
                <h3>Навушники</h3>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8V0mX_928fcu1egFVQrMNx4kMfZ1Ec7eojJ0KBiHYyA&s=10" alt="Навушники">
                <p>Ціна: 800 грн</p>
                <button class="minus">-</button>
                <span class="count">0</span>
                <button class="plus">+</button>
            </div>

            <div class="product-card" data-name="Мишка" data-price="450">
                <h3>Мишка</h3>
                <img src="https://mbuy24.com/products_pic/thumb/150/229/1319583-971059519.jpg" alt="Мишка">
                <p>Ціна: 450 грн</p>
                <button class="minus">-</button>
                <span class="count">0</span>
                <button class="plus">+</button>
            </div>

            <div class="product-card" data-name="Клавіатура" data-price="1200">
                <h3>Клавіатура</h3>
                <img src="https://content.rozetka.com.ua/goods/images/big/525376284.jpg" alt="Клавіатура">
                <p>Ціна: 1200 грн</p>
                <button class="minus">-</button>
                <span class="count">0</span>
                <button class="plus">+</button>
            </div>

        </div>

        <div class="cart">
            <h2>Кошик</h2>
            <ul id="cart-list"></ul>
            <h3>Сума: <span id="total">0</span> грн</h3>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
